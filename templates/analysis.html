{% extends "base.html" %}
{% set active = 'report' %}
{% block title %}{{ date }} — {{ handle }}{% endblock %}

{% block content %}
  <section aria-label="Runs">
    <h2 class="sec">Runs</h2>
    <div class="runs">
      {% for a in analyses %}
        <a class="run" href="/analysis/{{ a.date }}/{{ a.filename }}"
           {% if a.date == date and a.filename == filename %}aria-current="page"{% endif %}>
          <span class="d">{{ a.date[5:] }}</span>
          <span class="t">{{ a.time }}</span>
        </a>
      {% endfor %}
    </div>
  </section>

  <section aria-label="Report">
    <h2 class="sec">
      {{ date }} · <a href="/download/{{ date }}/{{ filename }}">raw JSON</a>
    </h2>
    <article class="report">{{ html|safe }}</article>
  </section>
{% endblock %}
