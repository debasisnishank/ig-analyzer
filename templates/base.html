<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0E14" />
  <title>{% block title %}{{ handle }} — Analyzer{% endblock %}</title>
  <style>
    /* ---------------------------------------------------------------
       Night instrument cluster. Amber backlight on a deep blue-black,
       monospace telemetry, serif reading column.
       Data hues validated for the dark surface (#141922):
       lightness band, chroma floor, CVD separation, contrast.
       --------------------------------------------------------------- */
    :root {
      --ground:    #0B0E14;
      --surface:   #141922;
      --raised:    #1B2230;
      --hairline:  #232B38;
      --hairline-2:#2E3949;

      --ink:       #E6EBF2;
      --ink-2:     #93A1B5;
      --ink-3:     #647287;

      --data:      #C28009;   /* primary data hue + instrument backlight */
      --data-lit:  #E9A93B;   /* accent for text/edges — never for fills */
      --data-2:    #3987E5;
      --pos:       #2F9668;
      --neg:       #DC4045;

      --r:  10px;
      --r-sm: 6px;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      --serif: Charter, "Bitstream Charter", "Iowan Old Style", "Source Serif Pro", Georgia, serif;
      --tap: 44px;
    }

    * { box-sizing: border-box; min-width: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }
    a { color: var(--data-lit); text-decoration: none; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    :focus-visible { outline: 2px solid var(--data-lit); outline-offset: 2px; border-radius: 3px; }

    /* ---- top rail ------------------------------------------------- */
    .rail {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: .6rem;
      padding: .7rem 1rem;
      padding-top: calc(.7rem + env(safe-area-inset-top));
      background: rgba(11,14,20,.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--hairline);
    }
    .lamp {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--data-lit);
      box-shadow: 0 0 8px 1px rgba(233,169,59,.55);
      flex: none;
    }
    .rail .who { font-size: .82rem; letter-spacing: .04em; color: var(--ink); }
    .rail .when {
      margin-left: auto; font-size: .68rem; letter-spacing: .08em;
      text-transform: uppercase; color: var(--ink-3);
    }

    /* ---- segmented nav -------------------------------------------- */
    nav.seg {
      position: sticky; top: 46px; z-index: 19;
      display: flex; gap: 2px; padding: .5rem 1rem .6rem;
      background: var(--ground);
      border-bottom: 1px solid var(--hairline);
    }
    nav.seg a {
      flex: 1; min-height: 38px;
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--ink-3);
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-sm);
    }
    nav.seg a[aria-current="page"] {
      color: var(--ground); background: var(--data-lit);
      border-color: var(--data-lit); font-weight: 600;
    }

    main { padding: 1rem 1rem 3rem; }
    .stack > * + * { margin-top: 1.25rem; }

    h2.sec {
      margin: 0 0 .7rem;
      font-size: .68rem; letter-spacing: .14em; text-transform: uppercase;
      color: var(--ink-3); font-weight: 500;
    }

    /* ---- stat tiles ------------------------------------------------ */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .tile {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r);
      padding: .7rem .75rem .6rem;
      min-width: 0;
    }
    .tile .lbl {
      font-size: .6rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tile .val {
      margin-top: .3rem;
      font-size: 1.6rem; line-height: 1.05; font-weight: 600;
      font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    }
    .tile .val .unit { font-size: .8rem; color: var(--ink-2); margin-left: 1px; }
    .tile .meta { display: flex; align-items: center; gap: .4rem; margin-top: .35rem; min-height: 20px; flex-wrap: wrap; }
    .delta { font-size: .66rem; font-variant-numeric: tabular-nums; display: inline-flex; gap: .18rem; white-space: nowrap; }
    .delta.up { color: var(--pos); }
    .delta.down { color: var(--neg); }
    .spark { margin-left: auto; display: block; flex: none; max-width: 100%; }

    /* signature: range rail — where today sits in this metric's own history */
    .rangerail { margin-top: .5rem; }
    .rangerail .track {
      position: relative; height: 3px; border-radius: 2px;
      background: var(--hairline-2);
    }
    .rangerail .tick {
      position: absolute; top: -3px; width: 2px; height: 9px;
      border-radius: 1px; background: var(--data-lit);
      box-shadow: 0 0 6px rgba(233,169,59,.5);
      transform: translateX(-1px);
    }
    .rangerail .ends {
      display: flex; justify-content: space-between;
      font-size: .55rem; letter-spacing: .06em; color: var(--ink-3);
      margin-top: .25rem; font-variant-numeric: tabular-nums;
    }

    /* ---- report ---------------------------------------------------- */
    .report {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r);
      padding: 1.1rem 1.05rem 1.3rem;
      font-family: var(--serif);
      font-size: 1.02rem;
      line-height: 1.62;
      color: #DCE3EC;
      overflow-wrap: break-word;
    }
    .report h1 { font-size: 1.3rem; line-height: 1.25; margin: 0 0 .8rem; }
    .report h2 { font-size: 1.08rem; margin: 1.6rem 0 .5rem; padding-top: .9rem; border-top: 1px solid var(--hairline); }
    .report h3 { font-size: .95rem; margin: 1.2rem 0 .4rem; color: var(--data-lit); }
    .report h1, .report h2 { font-family: var(--mono); letter-spacing: -.01em; font-weight: 600; }
    .report p { margin: 0 0 .85rem; }
    .report ul, .report ol { margin: 0 0 .9rem; padding-left: 1.15rem; }
    .report li { margin-bottom: .35rem; }
    .report strong { color: var(--ink); }
    .report code {
      font-family: var(--mono); font-size: .82em;
      background: var(--raised); padding: .1rem .3rem; border-radius: 4px;
    }
    .report blockquote {
      margin: 0 0 .9rem; padding: .6rem .8rem;
      border-left: 2px solid var(--data); background: var(--raised);
      border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: .92rem;
    }
    .report hr { border: 0; border-top: 1px solid var(--hairline); margin: 1.4rem 0; }

    /* tables scroll rather than squeeze the page */
    .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 0 .9rem; }
    .report table, table.data {
      border-collapse: collapse; width: 100%;
      font-family: var(--mono); font-size: .76rem;
      font-variant-numeric: tabular-nums;
    }
    .report th, .report td, table.data th, table.data td {
      border-bottom: 1px solid var(--hairline);
      padding: .45rem .6rem; text-align: right; white-space: nowrap;
    }
    .report th:first-child, .report td:first-child,
    table.data th:first-child, table.data td:first-child { text-align: left; }
    .report th, table.data th {
      color: var(--ink-3); font-weight: 500;
      font-size: .6rem; letter-spacing: .1em; text-transform: uppercase;
    }

    /* ---- runs strip ------------------------------------------------ */
    .runs { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: .3rem; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .runs::-webkit-scrollbar { display: none; }
    .run {
      flex: none; min-height: var(--tap);
      display: flex; flex-direction: column; justify-content: center;
      padding: .35rem .7rem;
      background: var(--surface); border: 1px solid var(--hairline);
      border-radius: var(--r-sm); color: var(--ink-2);
    }
    .run[aria-current="page"] { border-color: var(--data); color: var(--ink); background: var(--raised); }
    .run .d { font-size: .72rem; font-variant-numeric: tabular-nums; }
    .run .t { font-size: .58rem; color: var(--ink-3); letter-spacing: .06em; }

    /* ---- charts ---------------------------------------------------- */
    .chart { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r); padding: .85rem .9rem 1rem; }
    .chart h3 { margin: 0; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
    .chart .head { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .7rem; }
    .chart .now { margin-left: auto; font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .plotwrap { position: relative; display: flex; gap: .45rem; }
    .yaxis {
      position: relative; width: 3.1rem; flex: none;
      font-size: .58rem; color: var(--ink-3); font-variant-numeric: tabular-nums;
    }
    .yaxis span { position: absolute; right: 0; transform: translateY(-50%); white-space: nowrap; }
    .plot { position: relative; flex: 1; min-width: 0; touch-action: pan-y; }
    .plot svg { display: block; width: 100%; height: auto; }
    .xaxis { display: flex; justify-content: space-between; font-size: .58rem; color: var(--ink-3); margin: .3rem 0 0 3.55rem; font-variant-numeric: tabular-nums; }
    .tip {
      position: absolute; z-index: 5; pointer-events: none; opacity: 0;
      transform: translate(-50%, -140%);
      background: var(--raised); border: 1px solid var(--hairline-2);
      border-radius: var(--r-sm); padding: .3rem .5rem;
      font-size: .64rem; white-space: nowrap; font-variant-numeric: tabular-nums;
      transition: opacity .12s ease;
    }
    .tip.on { opacity: 1; }
    .cross { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--hairline-2); opacity: 0; }
    .cross.on { opacity: 1; }

    .empty {
      background: var(--surface); border: 1px dashed var(--hairline-2);
      border-radius: var(--r); padding: 1.4rem 1rem; text-align: center;
      color: var(--ink-3); font-size: .8rem;
    }
    .empty strong { display: block; color: var(--ink-2); margin-bottom: .3rem; font-size: .85rem; }

    details.tableview { margin-top: .6rem; }
    details.tableview summary {
      cursor: pointer; min-height: 38px; display: flex; align-items: center;
      font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
    }

    /* ---- wider screens: the phone layout stretches, it doesn't change ---- */
    @media (min-width: 700px) {
      main { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }
      .rail, nav.seg { padding-left: 1.5rem; padding-right: 1.5rem; }
      .stats { grid-template-columns: repeat(4, 1fr); gap: .7rem; }
      .report { padding: 1.8rem 2rem; font-size: 1.06rem; }
      .report h1 { font-size: 1.6rem; }
      /* Cap the measure on wide screens — tables and code still run full width. */
      .report p, .report li, .report h1, .report h2, .report h3, .report blockquote {
        max-width: 68ch;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <header class="rail">
    <span class="lamp" aria-hidden="true"></span>
    <span class="who">@{{ handle }}</span>
    <span class="when">{% if last_run %}{{ last_run }}{% else %}no runs{% endif %}</span>
  </header>

  <nav class="seg" aria-label="Views">
    <a href="/" {% if active == 'report' %}aria-current="page"{% endif %}>Report</a>
    <a href="/trends" {% if active == 'trends' %}aria-current="page"{% endif %}>Trends</a>
  </nav>

  <main class="stack">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
